
name: Deploy PIKU

on:
  push:
    branches:
      - main

# Prevent overlapping deployments
concurrency:
  group: piku-production
  cancel-in-progress: false

# Minimum permissions
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Ubuntu
    runs-on: [self-hosted, linux, x64, piku]

    steps:
      - name: Pull latest source code
        run: |
          cd /opt/todo
          git pull --ff-only origin main

      - name: Rebuild and restart PIKU
        run: |
          cd /opt/todo
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.tunnel.yml \
            up -d --build

      - name: Verify running containers
        run: |
          cd /opt/todo
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.tunnel.yml \
            ps
