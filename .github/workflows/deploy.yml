
name: Deploy PIKU

on:
  push:
    branches:
      - main

# Prevent overlapping deployments
concurrency:
  group: piku-production
  cancel-in-progress: false

# Minimum permissions
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Ubuntu
    runs-on: [self-hosted, linux, x64, piku]
    # A normal deploy takes about 5 minutes; don't let a stuck one hang for hours.
    timeout-minutes: 30

    steps:
      - name: Pull latest source code
        run: |
          cd /opt/todo
          git pull --ff-only origin main

      # Build first (including the migrate image, which is in the "tools" profile), so the
      # running app keeps serving while this happens.
      - name: Build images
        run: |
          cd /opt/todo
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.tunnel.yml \
            --profile tools \
            build

      # Database changes must be applied before the new API starts. Safe to run every time:
      # it does nothing when there are no new migrations.
      - name: Run database migrations
        run: |
          cd /opt/todo
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.tunnel.yml \
            run --rm migrate

      - name: Restart PIKU
        run: |
          cd /opt/todo
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.tunnel.yml \
            up -d

      - name: Verify running containers
        run: |
          cd /opt/todo
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.tunnel.yml \
            ps

      # Every rebuild leaves the previous images and build cache behind, which fills the disk.
      # Keeps the images in use and the last 3 days of build cache (so builds stay fast).
      # Never touches volumes (database, certificates).
      - name: Free disk space
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f --filter until=72h
          df -h /
