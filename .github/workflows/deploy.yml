
name: Deploy PIKU

on:
  push:
    branches:
      - main

# Prevent overlapping deployments
concurrency:
  group: piku-production
  cancel-in-progress: false

# Minimum permissions
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Ubuntu
    runs-on: [self-hosted, linux, x64, piku]
    # A normal deploy takes about 5 minutes; don't let a stuck one hang for hours.
    timeout-minutes: 30

    steps:
      - name: Pull latest source code
        run: |
          cd /opt/todo
          git pull --ff-only origin main

      - name: Rebuild and restart PIKU
        run: |
          cd /opt/todo
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.tunnel.yml \
            up -d --build

      - name: Verify running containers
        run: |
          cd /opt/todo
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.tunnel.yml \
            ps

      # Every rebuild leaves the previous images and build cache behind, which fills the disk.
      # Keeps the images in use and the last 3 days of build cache (so builds stay fast).
      # Never touches volumes (database, certificates).
      - name: Free disk space
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f --filter until=72h
          df -h /
